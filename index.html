<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui"
    />
    <title>Leaflet Side-by-side</title>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="leaflet-side-by-side.js"></script> -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />

    <!-- <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet-side-by-side@2.2.0/leaflet-side-by-side.css"
    /> -->

    <!-- <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="range.css" /> -->

    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Esri Leaflet -->
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

    <!-- Side-by-Side Plugin -->
    <script src="leaflet-side-by-side.js"></script>

    <script>
      const map = L.map("map", {
        center: [38.802, -77.1019],
        zoom: 9,
      });

      // light gray base layer
      var lightGrayBase = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ",
          maxZoom: 16,
        },
      ).addTo(map);

      var lightGrayBase = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ",
          maxZoom: 16,
        },
      ).addTo(map);

      // health topic data
      const healthLayer = L.tileLayer
        .wms(
          "https://mdhephtgis.cgis.us/arcgis/services/EPHT/LeadCounty/MapServer/WMSServer",
          {
            layers: "1",
            format: "image/png",
            transparent: true,
            opacity: 0.65,
            version: "1.1.0",
            attribution: "MDH EPHT",
          },
        )
        .addTo(map);

      const leftLayer = L.tileLayer.wms(
        "https://mdhephtgis.cgis.us/arcgis/services/EPHT/EJ_CVS_Test/MapServer/WMSServer",
        {
          layers: "1",
          format: "image/png",
          transparent: true,
          opacity: 0.95,
          version: "1.1.0",
          attribution: "MDH EPHT",
        },
      );

      const rightLayer = L.tileLayer.wms(
        "https://mdhephtgis.cgis.us/arcgis/services/EPHT/EJ_CVS_Test/MapServer/WMSServer",
        {
          layers: "0",
          format: "image/png",
          transparent: true,
          opacity: 0.7,
          version: "1.1.0",
          attribution: "MDH EPHT",
        },
      );

      // const leftLayer = L.esri.dynamicMapLayer({
      //   url: "https://mdhephtgis.cgis.us/arcgis/rest/services/EPHT/LeadCounty/MapServer",
      //   layers: [1],
      //   opacity: 0.8,
      // });

      leftLayer.addTo(map);
      rightLayer.addTo(map);

      // console.log("L:", L.control.sideBySide);

      const sbs = L.control.sideBySide(leftLayer, rightLayer).addTo(map);
    </script>
  </body>
</html>
