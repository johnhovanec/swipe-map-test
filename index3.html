<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>5 Leaflet Side‑by‑Side – Valid Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/leaflet-side-by-side@2.2.1/dist/leaflet-side-by-side.js"></script>

    <script>
      // Sanity check
      console.log("L.control.sideBySide exists:", typeof L.control.sideBySide);

      // Create map
      const map = L.map("map").setView([38.8, -77.1], 9);

      // Left layer
      const leftLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19 },
      );

      // Right layer
      const rightLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19 },
      );

      // IMPORTANT: layers must be added first
      leftLayer.addTo(map);
      rightLayer.addTo(map);

      // Create side‑by‑side control
      L.control.sideBySide(leftLayer, rightLayer).addTo(map);
    </script>
  </body>
</html>
